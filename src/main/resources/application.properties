spring.application.name=incidentes-frontend
server.port=${PORT:8081}

# URL base de la API REST del backend (Spring Boot + MongoDB)
api.url=${API_URL:http://localhost:8080}

# Paquetes que Vaadin escanea en modo desarrollo
vaadin.allowed-packages=com.vaadin,org.vaadin,com.empresa.salacontrol
vaadin.launch-browser=false

spring.jackson.deserialization.fail-on-unknown-properties=false
